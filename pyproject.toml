[project]
name = "comfyui-corridorkey2"
description = "CorridorKey 2.0 green/blue-screen keying for ComfyUI: alpha hints and keyframes, temporal windows, depth and surface normals, semantic and motion tracking, matte refinement and LoRA fine-tuning."
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "safetensors>=0.4",
    "einops>=0.8",
    "timm>=1.0",
    "scipy>=1.11",
    "opencv-python>=4.8",
    "huggingface_hub>=0.34",
]

[project.urls]
Repository = "https://github.com/marawan206/ComfyUI-CorridorKey2.0"
Issues = "https://github.com/marawan206/ComfyUI-CorridorKey2.0/issues"

[tool.comfy]
PublisherId = "marawan206"
DisplayName = "CorridorKey 2.0"
Icon = ""
requires-comfyui = ">=0.25.0"

